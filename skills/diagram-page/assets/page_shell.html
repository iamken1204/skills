<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{DOCUMENT_TITLE}}</title>
<script>
  (function () {
    var lang = null;
    try { lang = localStorage.getItem('rsf-lang'); } catch (e) {}
    if (lang !== 'en' && lang !== 'tw') {
      lang = /^zh/i.test(navigator.language || '') ? 'tw' : 'en';
    }
    document.documentElement.setAttribute('data-lang', lang);
    document.documentElement.setAttribute('lang', lang === 'tw' ? 'zh-Hant-TW' : 'en');
  })();
</script>
<style>
  :root {
    --bg: #f6f6f9;
    --fg: #1d1d27;
    --muted: #64647a;
    --panel: #ffffff;
    --line: #c9c9d6;
    --zone: #9a9ab0;
    --vendor-fill: #efe9fb;
    --vendor-stroke: #d9c9fb;
    --vendor-ink: #4b2e9c;
    --customer-fill: #edf6dc;
    --customer-stroke: #b9d985;
    --customer-ink: #3f6a06;
    --step: #e8872b;
    --step-ink: #1a1a1a;
    --wall: #d7a79a;
    --wall-ink: #633023;
    --code-bg: #ecebf2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15151c;
      --fg: #ecebf3;
      --muted: #a2a2b6;
      --panel: #1f1f29;
      --line: #3b3b4c;
      --zone: #6a6a82;
      --vendor-fill: #2a2342;
      --vendor-stroke: #3f3268;
      --vendor-ink: #cdbcff;
      --customer-fill: #222e18;
      --customer-stroke: #48682a;
      --customer-ink: #c7ef86;
      --step: #f0953b;
      --step-ink: #1a1a1a;
      --wall: #6e3d33;
      --wall-ink: #f0b7a8;
      --code-bg: #2a2a37;
    }
  }

  /* language switch: both languages are in the markup, CSS shows one */
  html[data-lang="en"] .tw { display: none !important; }
  html[data-lang="tw"] .en { display: none !important; }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
                 "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Noto Sans", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 1424px; margin: 0 auto; padding: 28px 16px 56px; }
  a { color: var(--vendor-ink); }

  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); font-size: 15px; max-width: 70ch; }
  .lang {
    display: inline-flex; flex: none;
    border: 1px solid var(--line); border-radius: 999px; padding: 3px;
    background: var(--panel);
  }
  .lang button {
    appearance: none; border: 0; background: transparent; color: var(--muted);
    font: inherit; font-size: 13px; font-weight: 600;
    min-height: 32px; padding: 4px 12px; border-radius: 999px; cursor: pointer;
  }
  .lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

  figure { margin: 24px 0 0; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .scroll:focus-visible { outline: 2px solid var(--vendor-ink); outline-offset: -2px; }
  /* fades the right edge while part of the diagram is still off-screen */
  .scroll.more {
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 64px), transparent);
    mask-image: linear-gradient(to right, #000 calc(100% - 64px), transparent);
  }
  svg.diagram { display: block; width: 100%; height: auto; }
  svg.diagram text { font-family: inherit; fill: var(--fg); font-size: 14px; }
  svg.diagram .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  svg.diagram .b { font-weight: 650; }
  svg.diagram .s { font-size: 13px; }
  svg.diagram .xs { font-size: 12px; }
  svg.diagram .m { fill: var(--muted); }
  svg.diagram .vk { fill: var(--vendor-ink); }
  svg.diagram .ck { fill: var(--customer-ink); }
  svg.diagram .wk { fill: var(--wall-ink); }
  svg.diagram .sk { fill: var(--step-ink); font-weight: 700; font-size: 13px; }
  figcaption { margin-top: 10px; color: var(--muted); font-size: 13px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 28px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  section.card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px 20px;
  }
  section.card.wide { grid-column: 1 / -1; }
  section.card h2 { font-size: 15px; margin: 0 0 10px; }
  section.card h3 { font-size: 13px; margin: 14px 0 4px; color: var(--muted); font-weight: 650; }
  section.card h2 + h3 { margin-top: 0; }
  section.card p.note { margin: 12px 0 0; color: var(--muted); font-size: 13px; }
  section.card.own-vendor { border: 2px solid var(--vendor-stroke); }
  section.card.own-customer { border: 2px solid var(--customer-stroke); }
  section.card.own-vendor h2, section.card.own-customer h2 { font-size: 18px; margin-bottom: 12px; }
  section.card.own-vendor h2 { color: var(--vendor-ink); }
  section.card.own-customer h2 { color: var(--customer-ink); }

  ol.steps { margin: 0; padding: 0; list-style: none; }
  ol.steps li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 7px 0; font-size: 14px; }
  ol.steps li + li { border-top: 1px solid var(--line); }
  .badge {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--step); color: var(--step-ink);
    font-weight: 700; font-size: 12px;
    display: inline-flex; align-items: center; justify-content: center;
    margin-top: 1px;
  }
  ul.facts { margin: 0; padding-left: 18px; font-size: 14px; }
  ul.facts li { padding: 3px 0; }
  ul.items { margin: 0; padding: 0; list-style: none; }
  ul.items li { display: grid; grid-template-columns: 40px 1fr; gap: 10px; padding: 8px 0; font-size: 14px; }
  ul.items li + li { border-top: 1px solid var(--line); }
  .qty { align-self: start; text-align: center; font-weight: 700; font-size: 13px; border-radius: 6px; padding: 2px 0;
         background: var(--code-bg); }
  .own-vendor .qty { background: var(--vendor-stroke); color: var(--vendor-ink); }
  .own-customer .qty { background: var(--customer-stroke); color: var(--customer-ink); }
  .det { color: var(--muted); font-size: 13px; }
  .who { font-weight: 650; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.92em;
         background: var(--code-bg); padding: 1px 5px; border-radius: 4px; white-space: nowrap; }

  .tablewrap { overflow-x: auto; }
  table.spec { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.spec th, table.spec td { text-align: left; vertical-align: top; padding: 7px 10px 7px 0; }
  table.spec thead th { color: var(--muted); font-size: 13px; font-weight: 650; border-bottom: 1px solid var(--line); }
  table.spec tbody td, table.spec tbody th { border-top: 1px solid var(--line); }
  table.spec tbody th[scope="row"] { font-weight: 400; color: var(--muted); width: 26%; }
  table.spec tr.group th { font-weight: 650; color: var(--fg); padding-top: 14px; border-top: 0; }
</style>
</head>
<body>
<main>
  <header>
    <div>
{{HEADER}}
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-set-lang="en" aria-pressed="false">EN</button>
      <button type="button" data-set-lang="tw" aria-pressed="false">中文</button>
    </div>
  </header>

  <figure>
    <div class="scroll" tabindex="0" role="region"
         aria-label="Diagram, scrolls sideways"
         data-label-en="Diagram, scrolls sideways"
         data-label-tw="架構圖，可左右捲動">
{{DIAGRAM}}
    </div>
{{CAPTION}}
  </figure>
{{SECTIONS}}
</main>
<script>
  (function () {
    var root = document.documentElement;
    var buttons = document.querySelectorAll('[data-set-lang]');
    var labelled = document.querySelectorAll('[data-label-en]');
    var scrollers = document.querySelectorAll('.scroll');
    function apply(lang) {
      root.setAttribute('data-lang', lang);
      root.setAttribute('lang', lang === 'tw' ? 'zh-Hant-TW' : 'en');
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].setAttribute('aria-pressed', buttons[i].getAttribute('data-set-lang') === lang ? 'true' : 'false');
      }
      for (var j = 0; j < labelled.length; j++) {
        labelled[j].setAttribute('aria-label', labelled[j].getAttribute('data-label-' + lang));
      }
      try { localStorage.setItem('rsf-lang', lang); } catch (e) {}
    }
    // shows the right-edge fade only while the diagram overflows and is not scrolled to the end
    function updateHint(scroller) {
      var overflows = scroller.scrollWidth > scroller.clientWidth;
      var atEnd = scroller.scrollLeft + scroller.clientWidth >= scroller.scrollWidth - 1;
      scroller.classList.toggle('more', overflows && !atEnd);
    }
    function updateHints() {
      for (var k = 0; k < scrollers.length; k++) { updateHint(scrollers[k]); }
    }
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].addEventListener('click', function () { apply(this.getAttribute('data-set-lang')); });
    }
    for (var k = 0; k < scrollers.length; k++) {
      scrollers[k].addEventListener('scroll', function () { updateHint(this); }, { passive: true });
    }
    window.addEventListener('resize', updateHints);
    apply(root.getAttribute('data-lang') === 'tw' ? 'tw' : 'en');
    updateHints();
  })();
</script>
</body>
</html>
